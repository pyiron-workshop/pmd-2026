[build-system]
requires = [
    "hatchling>=1.27,<2",
    "hatch-jupyter-builder>=0.5.0"
]
build-backend = "hatchling.build"

[project]
name = "pyironflow"
description = "pyiron visual programming interface — Jupyter ReactFlow widget"
authors = [
    { name = "Jörg Neugebauer", email = "neugebauer@mpi-susmat.de" },
]
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11"
dependencies = [
    "anywidget",
    "traitlets",
    "ipython",
    "ipywidgets",
    "ipytree",
]
version = "0.1.0"
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Framework :: Jupyter",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/JNmpi/pyiron_aiflow"
Repository = "https://github.com/JNmpi/pyiron_aiflow"
"Bug Tracker" = "https://github.com/JNmpi/pyiron_aiflow/issues"

[tool.hatch.build]
include = [
    "src/pyironflow"
]

[tool.hatch.build.hooks.jupyter-builder]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "src/pyironflow/static/widget.js",
    "src/pyironflow/static/widget.css",
    "src/pyironflow/static/ngl.js"
]
skip-if-exists = [
    "src/pyironflow/static/widget.js",
    "src/pyironflow/static/ngl.js"
]
dependencies = ["hatch-jupyter-builder>=0.5.0"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
npm = "npm"
build_cmd = "build"

[tool.hatch.build.targets.sdist]
include = [
    "src/pyironflow"
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/pyironflow"
]

